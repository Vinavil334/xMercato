name: Dati mercato

# Builds the player-season table (minutes, starts, positions, goals, values) from the public
# Transfermarkt dataset, keeps it as a workflow artifact for 30 days and puts the backtest of
# needs and candidates in the run summary. Nothing is committed (about five minutes).

on:
  workflow_dispatch:
    inputs:
      da:
        description: "Prima stagione (anno di inizio)"
        default: "2018"

defaults:
  run:
    shell: bash

jobs:
  mercato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Scarica le tabelle Transfermarkt
        run: |
          mkdir -p "$RUNNER_TEMP/tm"
          for t in appearances game_lineups games competitions player_valuations players clubs transfers; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tm/$t.csv.gz" \
              "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/$t.csv.gz"
          done
          ls -la "$RUNNER_TEMP/tm"
      - name: Costruisci le tabelle
        run: |
          uv run xmercato mercato dati --tm "$RUNNER_TEMP/tm" --out mercato --da "${{ inputs.da || '2018' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dati-mercato
          path: mercato/
          retention-days: 30
      - name: Verifica di fabbisogni e candidati
        run: |
          {
            echo '### Verifica sulle finestre passate'
            echo '```'
            uv run xmercato mercato verifica --dati mercato
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Temporary - copy the elevens table to the log
        run: |
          echo "=====BEGIN formazioni====="
          base64 -w 0 mercato/formazioni_serie_a.csv.gz; echo
          echo "=====END formazioni====="
