name: Dati mercato

# Builds the player-season table (minutes, starts, positions, goals, values) from the public
# Transfermarkt dataset and keeps it as a workflow artifact for 30 days. Nothing is committed.

on:
  workflow_dispatch:
    inputs:
      da:
        description: "Prima stagione (anno di inizio)"
        default: "2018"
  # Temporary: runs from the branch that introduces this workflow.
  push:
    branches: [mercato-gennaio]
    paths: [.github/workflows/mercato-dati.yml]

defaults:
  run:
    shell: bash

jobs:
  mercato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Scarica le tabelle Transfermarkt
        run: |
          mkdir -p "$RUNNER_TEMP/tm"
          for t in appearances game_lineups games competitions player_valuations players clubs transfers; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tm/$t.csv.gz" \
              "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/$t.csv.gz"
          done
          ls -la "$RUNNER_TEMP/tm"
      - name: Costruisci le tabelle
        run: |
          uv run xmercato mercato dati --tm "$RUNNER_TEMP/tm" --out mercato --da "${{ inputs.da || '2018' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dati-mercato
          path: mercato/
          retention-days: 30
      - name: Copia nel log
        run: |
          tar czf - -C mercato . | base64 -w 0 > dump.b64
          echo "=====BEGIN mercato.tar.gz.b64====="
          cat dump.b64; echo
          echo "=====END mercato.tar.gz.b64====="
