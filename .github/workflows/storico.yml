name: Dati storici

# Builds the historical match table (football-data.co.uk results and odds + xG from the
# public archive of Understat shots), keeps it as a workflow artifact for 30 days and runs
# the backtest of the league table model on it. Nothing is committed: the data is rebuilt
# whenever needed.

on:
  workflow_dispatch:
    inputs:
      da:
        description: "Prima stagione (anno di inizio)"
        default: "2014"
      a:
        description: "Ultima stagione (anno di inizio)"
        default: "2026"

defaults:
  run:
    shell: bash

jobs:
  storico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra storico
      - name: Scarica l'archivio dei tiri Understat
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tiri.rds" \
            https://raw.githubusercontent.com/JaseZiv/worldfootballR_data/master/data/understat_shots/serie_a_shot_data.rds
      - name: Costruisci la tabella
        run: |
          uv run xmercato storico --da "${{ inputs.da || '2014' }}" --a "${{ inputs.a || '2026' }}" \
            --tiri "$RUNNER_TEMP/tiri.rds" --out storico/serie_a.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: storico-serie-a
          path: storico/serie_a.csv
          retention-days: 30
      - name: Backtest del modello della classifica
        run: |
          {
            echo '### Backtest (stagioni 2020-2025)'
            echo '```'
            uv run xmercato backtest --storico storico/serie_a.csv --da 2020 --a 2025
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
