name: Dati storici

# Builds the historical match table (football-data.co.uk results and odds + Understat xG)
# and keeps it as a workflow artifact for 30 days. Nothing is committed: the data is
# rebuilt whenever needed.

on:
  workflow_dispatch:
    inputs:
      da:
        description: "Prima stagione (anno di inizio)"
        default: "2014"
      a:
        description: "Ultima stagione (anno di inizio)"
        default: "2026"
  # Temporary: first run from the branch that introduces this workflow.
  push:
    branches: [classifica-xg]
    paths: [.github/workflows/storico.yml]

defaults:
  run:
    shell: bash

jobs:
  storico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Costruisci la tabella
        run: |
          uv run xmercato storico --da "${{ inputs.da || '2014' }}" --a "${{ inputs.a || '2026' }}" \
            --out storico/serie_a.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: storico-serie-a
          path: storico/serie_a.csv
          retention-days: 30
      - name: Copia nel log
        run: |
          echo "=====BEGIN storico/serie_a.csv====="
          cat storico/serie_a.csv
          echo "=====END storico/serie_a.csv====="
