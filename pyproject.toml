[project]
name = "xmercato"
version = "0.0.1"
description = "Player projections, transfer suggestions and league table simulation for Serie A"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    # The app. Kept in the core dependencies so that hosting services that only read
    # uv.lock install it; the modelling code itself never imports Streamlit.
    "streamlit>=1.67",
    "altair>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
xmercato = "xmercato.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmercato"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E501"]  # long user-facing Italian strings
